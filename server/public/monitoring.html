<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EyeD - DevOps Monitor</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    .monitor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
    .status-badge.healthy { background: var(--green); color: #000; }
    .status-badge.degraded { background: var(--orange); color: #000; }
    .status-badge.critical { background: var(--red); color: #fff; }
    .metric-value { font-size: 28px; font-weight: 700; line-height: 1.2; }
    .metric-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .metric-sub { font-size: 11px; color: var(--text-muted); }
    .alert-item { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
    .alert-item.critical { background: rgba(239,68,68,0.15); border-left: 3px solid var(--red); }
    .alert-item.warning { background: rgba(245,158,11,0.15); border-left: 3px solid var(--orange); }
    .alert-item.resolved { opacity: 0.5; }
    .alert-severity { font-size: 11px; font-weight: 700; text-transform: uppercase; min-width: 60px; }
    .chart-container { background: var(--surface); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .chart-canvas { width: 100%; height: 120px; position: relative; }
    .sparkline { display: flex; align-items: flex-end; gap: 1px; height: 60px; }
    .sparkline-bar { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-width: 2px; transition: height 0.3s; }
    .sparkline-bar.error { background: var(--red); }
    .table-routes { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table-routes th { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
    .table-routes td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
    .table-routes td.mono { font-family: monospace; font-size: 12px; }
    .refresh-info { font-size: 11px; color: var(--text-muted); float: right; }
    .section { margin-bottom: 24px; }
    .section h3 { margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .db-table-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
    .db-table-card { background: var(--bg); padding: 10px; border-radius: 6px; text-align: center; }
    .db-table-card .value { font-size: 20px; font-weight: 700; }
    .db-table-card .label { font-size: 11px; color: var(--text-muted); }
    .error-row { font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; gap: 10px; }
    .error-row .err-status { font-weight: 700; min-width: 30px; }
    .error-row .err-status.s4 { color: var(--orange); }
    .error-row .err-status.s5 { color: var(--red); }
    .error-row .err-path { font-family: monospace; flex: 1; word-break: break-all; }
    .error-row .err-time { color: var(--text-muted); min-width: 70px; text-align: right; }
    .mem-bar { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .mem-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
    .mem-bar-fill.ok { background: var(--green); }
    .mem-bar-fill.warn { background: var(--orange); }
    .mem-bar-fill.crit { background: var(--red); }
  </style>
</head>
<body>
  <header>
    <h1>EyeD DevOps Monitor</h1>
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/monitoring" class="active">Monitor</a>
    </nav>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 20px;">
    <div id="auth-prompt" style="text-align:center;padding:60px 20px">
      <h2>Enter Admin Key</h2>
      <p style="color:var(--text-muted);margin:12px 0">Master key or admin API key required</p>
      <input id="monitor-key" type="password" placeholder="Admin key..." style="padding:10px 16px;width:300px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px">
      <br><button class="btn primary" onclick="authenticate()" style="margin-top:12px;padding:10px 24px">Connect</button>
    </div>

    <div id="monitor-content" style="display:none">
      <!-- Health banner -->
      <div id="health-banner" class="section" style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:12px">
          <span id="health-status" class="status-badge healthy">Healthy</span>
          <span id="uptime-display" style="color:var(--text-muted);font-size:13px"></span>
        </div>
        <span class="refresh-info">Auto-refresh: 10s</span>
      </div>

      <!-- Key metrics -->
      <div class="monitor-grid" id="key-metrics"></div>

      <!-- Alerts -->
      <div class="section">
        <h3>Active Alerts</h3>
        <div id="alerts-active"></div>
      </div>

      <!-- Request throughput sparkline -->
      <div class="section">
        <h3>Request Throughput (RPS)</h3>
        <div class="chart-container">
          <div id="rps-sparkline" class="sparkline"></div>
        </div>
      </div>

      <!-- Latency sparkline -->
      <div class="section">
        <h3>Response Latency P95 (ms)</h3>
        <div class="chart-container">
          <div id="latency-sparkline" class="sparkline"></div>
        </div>
      </div>

      <!-- Memory usage -->
      <div class="section">
        <h3>Memory Usage</h3>
        <div id="memory-section"></div>
      </div>

      <!-- Database -->
      <div class="section">
        <h3>Database</h3>
        <div id="db-section"></div>
      </div>

      <!-- Top routes -->
      <div class="section">
        <h3>Top Routes (last 10s)</h3>
        <div id="routes-section" style="overflow-x:auto"></div>
      </div>

      <!-- Recent errors -->
      <div class="section">
        <h3>Recent Errors</h3>
        <div id="errors-section"></div>
      </div>

      <!-- Alert history -->
      <div class="section">
        <h3>Alert History</h3>
        <div id="alert-history"></div>
      </div>
    </div>
  </main>

  <script>
    let adminKey = sessionStorage.getItem('eyedMonitorKey') || '';
    let refreshTimer = null;

    function esc(str) {
      if (str == null) return '';
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    function fmtBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    }

    function fmtUptime(seconds) {
      const d = Math.floor(seconds / 86400);
      const h = Math.floor((seconds % 86400) / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      const parts = [];
      if (d > 0) parts.push(d + 'd');
      if (h > 0) parts.push(h + 'h');
      if (m > 0) parts.push(m + 'm');
      parts.push(s + 's');
      return parts.join(' ');
    }

    function fmtNum(n) {
      if (n == null) return '0';
      return Number(n).toLocaleString();
    }

    async function api(path) {
      const res = await fetch('/api' + path, {
        headers: { 'Authorization': 'Bearer ' + adminKey, 'Content-Type': 'application/json' },
      });
      if (!res.ok) throw new Error('API error: ' + res.status);
      return res.json();
    }

    function authenticate() {
      adminKey = document.getElementById('monitor-key').value.trim();
      if (!adminKey) return;
      sessionStorage.setItem('eyedMonitorKey', adminKey);
      document.getElementById('auth-prompt').style.display = 'none';
      document.getElementById('monitor-content').style.display = 'block';
      startRefresh();
    }

    function startRefresh() {
      loadAll();
      refreshTimer = setInterval(loadAll, 10000);
    }

    async function loadAll() {
      try {
        const [overview, reqSeries, alerts, errors] = await Promise.all([
          api('/monitor/overview'),
          api('/monitor/metrics/requests?count=60'),
          api('/monitor/alerts'),
          api('/monitor/errors'),
        ]);
        renderOverview(overview);
        renderRpsSparkline(reqSeries.series);
        renderLatencySparkline(reqSeries.series);
        renderMemory(overview);
        renderDatabase(overview);
        renderRoutes(reqSeries.series);
        renderAlerts(alerts);
        renderErrors(errors.errors);
      } catch (err) {
        console.error('Monitor refresh failed:', err);
      }
    }

    function renderOverview(data) {
      const el = document.getElementById('health-status');
      el.textContent = data.status.charAt(0).toUpperCase() + data.status.slice(1);
      el.className = 'status-badge ' + data.status;

      document.getElementById('uptime-display').textContent = 'Uptime: ' + fmtUptime(data.uptime);

      const r = data.requests || {};
      const db = data.database || {};
      document.getElementById('key-metrics').innerHTML = `
        <div class="card">
          <div class="metric-value">${esc(String(r.rps || 0))}</div>
          <div class="metric-label">Requests/sec</div>
        </div>
        <div class="card">
          <div class="metric-value">${esc(String(r.latency ? r.latency.p95 : 0))}ms</div>
          <div class="metric-label">P95 Latency</div>
        </div>
        <div class="card">
          <div class="metric-value">${esc(String(r.errorRate || 0))}%</div>
          <div class="metric-label">Error Rate</div>
        </div>
        <div class="card">
          <div class="metric-value">${fmtBytes(data.memory ? data.memory.heapUsed : 0)}</div>
          <div class="metric-label">Heap Used</div>
        </div>
        <div class="card">
          <div class="metric-value">${fmtBytes(db.dbSize || 0)}</div>
          <div class="metric-label">Database Size</div>
        </div>
        <div class="card">
          <div class="metric-value">${fmtNum(db.tables ? db.tables.events : 0)}</div>
          <div class="metric-label">Total Events</div>
        </div>
        <div class="card">
          <div class="metric-value">${fmtNum(db.tables ? db.tables.sessions : 0)}</div>
          <div class="metric-label">Total Sessions</div>
        </div>
        <div class="card">
          <div class="metric-value">${fmtNum(data.activeAlerts.length)}</div>
          <div class="metric-label">Active Alerts</div>
        </div>
      `;
    }

    function renderSparkline(containerId, series, valueExtractor, barClass) {
      const el = document.getElementById(containerId);
      if (!series || series.length === 0) { el.innerHTML = '<span style="color:var(--text-muted);font-size:12px">No data yet</span>'; return; }
      const values = series.map(valueExtractor);
      const max = Math.max(...values, 1);
      el.innerHTML = values.map(v => {
        const pct = Math.max(2, (v / max) * 100);
        const cls = barClass ? (typeof barClass === 'function' ? barClass(v) : barClass) : '';
        return '<div class="sparkline-bar ' + cls + '" style="height:' + pct.toFixed(1) + '%"></div>';
      }).join('');
    }

    function renderRpsSparkline(series) {
      renderSparkline('rps-sparkline', series, s => s.rps || 0);
    }

    function renderLatencySparkline(series) {
      renderSparkline('latency-sparkline', series, s => s.latency ? s.latency.p95 : 0,
        v => v > 5000 ? 'error' : '');
    }

    function renderMemory(data) {
      if (!data.memory) return;
      const m = data.memory;
      const os = data.os || {};
      const heapPct = m.heapTotal > 0 ? (m.heapUsed / m.heapTotal * 100) : 0;
      const sysPct = os.totalMem > 0 ? ((os.totalMem - os.freeMem) / os.totalMem * 100) : 0;
      const heapClass = heapPct > 90 ? 'crit' : heapPct > 70 ? 'warn' : 'ok';
      const sysClass = sysPct > 90 ? 'crit' : sysPct > 70 ? 'warn' : 'ok';

      document.getElementById('memory-section').innerHTML = `
        <div class="monitor-grid">
          <div class="card">
            <div class="metric-label">Heap</div>
            <div>${fmtBytes(m.heapUsed)} / ${fmtBytes(m.heapTotal)}</div>
            <div class="mem-bar"><div class="mem-bar-fill ${heapClass}" style="width:${heapPct.toFixed(1)}%"></div></div>
          </div>
          <div class="card">
            <div class="metric-label">RSS</div>
            <div>${fmtBytes(m.rss)}</div>
          </div>
          <div class="card">
            <div class="metric-label">External</div>
            <div>${fmtBytes(m.external)}</div>
          </div>
          <div class="card">
            <div class="metric-label">System Memory</div>
            <div>${fmtBytes(os.totalMem - os.freeMem)} / ${fmtBytes(os.totalMem)}</div>
            <div class="mem-bar"><div class="mem-bar-fill ${sysClass}" style="width:${sysPct.toFixed(1)}%"></div></div>
          </div>
          <div class="card">
            <div class="metric-label">Load Average</div>
            <div>${(os.loadAvg || [0,0,0]).map(l => esc(String(l))).join(' / ')}</div>
            <div class="metric-sub">${esc(String(os.cpuCount))} CPUs</div>
          </div>
        </div>
      `;
    }

    function renderDatabase(data) {
      const db = data.database;
      if (!db) return;
      document.getElementById('db-section').innerHTML = `
        <div class="monitor-grid" style="margin-bottom:12px">
          <div class="card">
            <div class="metric-label">Database File</div>
            <div class="metric-value" style="font-size:20px">${fmtBytes(db.dbSize)}</div>
          </div>
          <div class="card">
            <div class="metric-label">Screenshot Disk</div>
            <div class="metric-value" style="font-size:20px">${fmtBytes(db.screenshotDisk.size)}</div>
            <div class="metric-sub">${fmtNum(db.screenshotDisk.count)} files</div>
          </div>
        </div>
        <div class="db-table-grid">
          ${Object.entries(db.tables).map(([name, count]) =>
            '<div class="db-table-card"><div class="value">' + fmtNum(count) + '</div><div class="label">' + esc(name) + '</div></div>'
          ).join('')}
        </div>
      `;
    }

    function renderRoutes(series) {
      const latest = series[series.length - 1];
      if (!latest || !latest.topRoutes || latest.topRoutes.length === 0) {
        document.getElementById('routes-section').innerHTML = '<span style="color:var(--text-muted);font-size:13px">No requests in this interval</span>';
        return;
      }
      document.getElementById('routes-section').innerHTML = `
        <table class="table-routes">
          <tr><th>Route</th><th>Requests</th><th>Avg (ms)</th><th>Max (ms)</th></tr>
          ${latest.topRoutes.map(r => `
            <tr>
              <td class="mono">${esc(r.route)}</td>
              <td>${fmtNum(r.count)}</td>
              <td>${esc(String(r.avgMs))}</td>
              <td>${esc(String(r.maxMs))}</td>
            </tr>
          `).join('')}
        </table>
      `;
    }

    function renderAlerts(data) {
      const activeEl = document.getElementById('alerts-active');
      if (data.active.length === 0) {
        activeEl.innerHTML = '<span style="color:var(--text-muted);font-size:13px">No active alerts</span>';
      } else {
        activeEl.innerHTML = data.active.map(a => `
          <div class="alert-item ${esc(a.severity)}">
            <span class="alert-severity" style="color:${a.severity === 'critical' ? 'var(--red)' : 'var(--orange)'}">${esc(a.severity)}</span>
            <span style="flex:1">${esc(a.message)}</span>
            <span style="color:var(--text-muted);font-size:11px">${new Date(a.triggeredAt).toLocaleTimeString()}</span>
          </div>
        `).join('');
      }

      const historyEl = document.getElementById('alert-history');
      if (data.history.length === 0) {
        historyEl.innerHTML = '<span style="color:var(--text-muted);font-size:13px">No alert history</span>';
      } else {
        historyEl.innerHTML = data.history.slice(0, 30).map(a => `
          <div class="alert-item ${esc(a.severity)} ${a.resolved ? 'resolved' : ''}">
            <span class="alert-severity" style="color:${a.severity === 'critical' ? 'var(--red)' : 'var(--orange)'}">${esc(a.severity)}</span>
            <span style="flex:1">${esc(a.message)}${a.resolved ? ' (resolved)' : ''}</span>
            <span style="color:var(--text-muted);font-size:11px">${new Date(a.triggeredAt).toLocaleTimeString()}</span>
          </div>
        `).join('');
      }
    }

    function renderErrors(errors) {
      const el = document.getElementById('errors-section');
      if (!errors || errors.length === 0) {
        el.innerHTML = '<span style="color:var(--text-muted);font-size:13px">No recent errors</span>';
        return;
      }
      el.innerHTML = errors.slice(0, 30).map(e => `
        <div class="error-row">
          <span class="err-status s${Math.floor(e.status / 100)}">${esc(String(e.status))}</span>
          <span style="min-width:40px">${esc(e.method)}</span>
          <span class="err-path">${esc(e.path)}</span>
          <span style="color:var(--text-muted);font-size:11px">${esc(String(Math.round(e.duration)))}ms</span>
          <span class="err-time">${new Date(e.time).toLocaleTimeString()}</span>
        </div>
      `).join('');
    }

    // Auto-auth if key is cached
    if (adminKey) {
      document.getElementById('auth-prompt').style.display = 'none';
      document.getElementById('monitor-content').style.display = 'block';
      startRefresh();
    }

    document.getElementById('monitor-key').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') authenticate();
    });
  </script>
</body>
</html>
