<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EyeD</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="popup">
    <header>
      <img src="../icons/icon48.png" alt="EyeD" class="logo-icon">
      <div class="header-text">
        <h1>EyeD</h1>
        <span id="version">v1.3</span>
      </div>
      <div class="header-right">
        <span id="network-dot" class="net-dot off" title="Server disconnected"></span>
        <button id="btn-settings" class="btn icon-btn" title="Settings">&#9881;</button>
      </div>
    </header>

    <!-- Recording Toggle -->
    <div class="section">
      <button id="btn-toggle-recording" class="btn recording-btn full-width">
        <span id="rec-dot" class="rec-dot off"></span>
        <span id="rec-label">Start Recording</span>
      </button>
    </div>

    <!-- Compact Status Grid -->
    <div id="status-section" class="section status-grid">
      <div class="stat-cell">
        <span class="stat-val off" id="tracker-status">Off</span>
        <span class="stat-lbl">Tracker</span>
      </div>
      <div class="stat-cell">
        <span class="stat-val off" id="tracking-status">Idle</span>
        <span class="stat-lbl">Tracking</span>
      </div>
      <div class="stat-cell">
        <span class="stat-val off" id="recording-status">Off</span>
        <span class="stat-lbl">Recording</span>
      </div>
      <div class="stat-cell">
        <span class="stat-val" id="queue-status">0</span>
        <span class="stat-lbl">Queued</span>
      </div>
    </div>

    <!-- Page Stats Bar -->
    <div class="section page-stats-bar">
      <span id="page-stats" class="page-stats-text">No page data</span>
    </div>

    <!-- Primary Actions -->
    <div class="section">
      <button id="btn-open-tracker" class="btn primary full-width">Open Eye Tracker</button>
    </div>

    <!-- Overlay Toggles — show active state -->
    <div class="section">
      <h2>Overlays</h2>
      <div class="btn-trio">
        <button id="btn-toggle-heatmap" class="btn toggle-btn" data-active="false">Heatmap</button>
        <button id="btn-toggle-scanpath" class="btn toggle-btn" data-active="false">Scanpath</button>
        <button id="btn-toggle-cursor" class="btn toggle-btn" data-active="false">Cursor</button>
      </div>
    </div>

    <!-- Collapsible: Tracking Controls -->
    <details class="section collapsible">
      <summary class="collapse-header">Tracking Controls</summary>
      <div class="collapse-body">
        <div class="btn-pair">
          <button id="btn-start" class="btn success" disabled>Start Tracking</button>
          <button id="btn-stop" class="btn danger" disabled>Stop Tracking</button>
        </div>
      </div>
    </details>

    <!-- Collapsible: Capture & Replay -->
    <details class="section collapsible">
      <summary class="collapse-header">Capture &amp; Replay</summary>
      <div class="collapse-body">
        <div class="btn-pair">
          <button id="btn-screenshot-viewport" class="btn">Viewport Shot</button>
          <button id="btn-screenshot-fullpage" class="btn">Full Page Shot</button>
        </div>
        <button id="btn-replay" class="btn full-width" style="margin-top:6px">Toggle Gaze Replay</button>
      </div>
    </details>

    <!-- Collapsible: Session -->
    <details class="section collapsible">
      <summary class="collapse-header">Session</summary>
      <div class="collapse-body">
        <div class="session-row">
          <input type="text" id="session-name" class="session-input" placeholder="Name this session...">
          <button id="btn-name-session" class="btn">Set</button>
        </div>
        <div class="btn-pair" style="margin-top:6px">
          <button id="btn-save-session" class="btn">Save</button>
          <button id="btn-new-session" class="btn">New Session</button>
        </div>
        <div id="saved-sessions" class="saved-sessions"></div>
      </div>
    </details>

    <!-- Collapsible: Feedback -->
    <details class="section collapsible">
      <summary class="collapse-header">Send Feedback</summary>
      <div class="collapse-body">
        <div class="fb-form">
          <select id="fb-type" class="session-input" style="margin-bottom:6px">
            <option value="bug">Bug Report</option>
            <option value="feature">Feature Request</option>
            <option value="usability">Usability Issue</option>
            <option value="performance">Performance Issue</option>
            <option value="other">Other</option>
          </select>
          <input type="text" id="fb-title" class="session-input" placeholder="Brief title..." style="margin-bottom:6px">
          <textarea id="fb-description" class="session-input" placeholder="Describe the issue or suggestion..." rows="3" style="resize:vertical;margin-bottom:6px"></textarea>
          <details class="sub-details">
            <summary style="font-size:0.7rem;color:#8b949e;cursor:pointer;margin-bottom:4px">Extra details (optional)</summary>
            <textarea id="fb-steps" class="session-input" placeholder="Steps to reproduce..." rows="2" style="resize:vertical;margin-bottom:4px"></textarea>
            <input type="text" id="fb-expected" class="session-input" placeholder="Expected behavior..." style="margin-bottom:4px">
            <input type="text" id="fb-actual" class="session-input" placeholder="Actual behavior...">
          </details>
          <button id="btn-send-feedback" class="btn primary full-width" style="margin-top:6px">Submit Feedback</button>
          <div id="fb-status" class="fb-status"></div>
        </div>
      </div>
    </details>

    <!-- Footer Actions -->
    <div class="section footer-actions">
      <button id="btn-open-insights" class="btn full-width">Open Dashboard</button>
      <div class="btn-pair">
        <button id="btn-export" class="btn">Export</button>
        <button id="btn-clear" class="btn danger-outline">Clear Data</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
