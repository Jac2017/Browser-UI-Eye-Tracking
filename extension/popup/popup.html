<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EyeD</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="popup">
    <header>
      <img src="../icons/icon48.png" alt="EyeD" class="logo-icon">
      <div class="header-text">
        <h1>EyeD</h1>
        <span id="version">v1.0</span>
      </div>
    </header>

    <!-- Status -->
    <div id="status-section" class="section">
      <div class="status-row">
        <span class="status-label">Tracker:</span>
        <span id="tracker-status" class="status-value off">Not running</span>
      </div>
      <div class="status-row">
        <span class="status-label">Tracking:</span>
        <span id="tracking-status" class="status-value off">Inactive</span>
      </div>
      <div class="status-row">
        <span class="status-label">This page:</span>
        <span id="page-stats" class="status-value">No data</span>
      </div>
    </div>

    <!-- Main Actions -->
    <div class="section">
      <button id="btn-open-tracker" class="btn primary full-width">
        Open Tracker
      </button>
      <div class="btn-pair">
        <button id="btn-toggle-heatmap" class="btn">Toggle Heatmap</button>
        <button id="btn-toggle-cursor" class="btn">Toggle Cursor</button>
      </div>
    </div>

    <!-- Tracking Controls -->
    <div class="section">
      <h2>Tracking</h2>
      <div class="btn-pair">
        <button id="btn-start" class="btn success" disabled>Start</button>
        <button id="btn-stop" class="btn danger" disabled>Stop</button>
      </div>
    </div>

    <!-- Data -->
    <div class="section">
      <h2>Data</h2>
      <div class="btn-pair">
        <button id="btn-export" class="btn">Export Session</button>
        <button id="btn-clear" class="btn danger-outline">Clear Page Data</button>
      </div>
    </div>

    <!-- Info -->
    <div id="info-section" class="section small">
      <p>Gaze data shown as thermal heatmap (blue→red).</p>
      <p>First-viewed elements shown in <span class="orange">orange</span>.</p>
      <p>Touch/mouse traces included as additional layers.</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
