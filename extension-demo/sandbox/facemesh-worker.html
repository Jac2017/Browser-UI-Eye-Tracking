<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>EyeD FaceMesh Sandbox</title>
</head>
<body>
  <script src="../lib/face_mesh.js"></script>
  <script>
    let faceMesh = null;
    let ready = false;

    function init() {
      try {
        faceMesh = new FaceMesh({
          locateFile: (file) => {
            // Sandbox pages can't use chrome.runtime.getURL, so we use relative paths
            return '../lib/' + file;
          }
        });

        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5,
        });

        faceMesh.onResults((results) => {
          const landmarks = (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0)
            ? results.multiFaceLandmarks[0]
            : null;
          // Send landmarks back to parent
          window.parent.postMessage({ type: 'facemesh-results', landmarks: landmarks }, '*');
        });

        faceMesh.initialize().then(() => {
          ready = true;
          window.parent.postMessage({ type: 'facemesh-ready' }, '*');
          console.log('[Sandbox] FaceMesh initialized');
        }).catch((err) => {
          window.parent.postMessage({ type: 'facemesh-error', error: err.message }, '*');
          console.error('[Sandbox] FaceMesh init error:', err);
        });
      } catch (err) {
        window.parent.postMessage({ type: 'facemesh-error', error: err.message }, '*');
        console.error('[Sandbox] FaceMesh constructor error:', err);
      }
    }

    // Listen for video frames from parent
    window.addEventListener('message', async (event) => {
      if (event.data && event.data.type === 'process-frame' && ready && faceMesh) {
        try {
          // Receive ImageBitmap and send to FaceMesh
          const bitmap = event.data.bitmap;
          // Create a canvas to draw the bitmap
          const canvas = document.createElement('canvas');
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(bitmap, 0, 0);
          bitmap.close();
          await faceMesh.send({ image: canvas });
        } catch (e) {
          console.warn('[Sandbox] Frame error:', e);
        }
      }
    });

    init();
  </script>
</body>
</html>
