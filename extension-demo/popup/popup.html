<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EyeD Demo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="popup">
    <header>
      <img src="../icons/icon48.png" alt="EyeD" class="logo-icon">
      <div class="header-text">
        <h1>EyeD</h1>
        <span id="version" style="background:#d29922;color:#000;padding:1px 6px;border-radius:8px;font-size:0.6rem;font-weight:700">DEMO</span>
      </div>
      <div class="header-right">
        <span class="net-dot demo" title="Demo mode — local only" style="background:#d29922"></span>
      </div>
    </header>

    <!-- Demo Banner -->
    <div class="section" style="background:#d2992215;border:1px solid #d2992244;border-radius:6px;padding:8px;margin-bottom:8px">
      <p style="font-size:0.7rem;color:#d29922;text-align:center;margin:0">
        Local demo — no data leaves your browser. No server or API key needed.
      </p>
    </div>

    <!-- Recording Toggle -->
    <div class="section">
      <button id="btn-toggle-recording" class="btn recording-btn full-width">
        <span id="rec-dot" class="rec-dot off"></span>
        <span id="rec-label">Start Recording</span>
      </button>
    </div>

    <!-- Compact Status Grid -->
    <div id="status-section" class="section status-grid">
      <div class="stat-cell">
        <span class="stat-val off" id="tracker-status">Off</span>
        <span class="stat-lbl">Tracker</span>
      </div>
      <div class="stat-cell">
        <span class="stat-val off" id="tracking-status">Idle</span>
        <span class="stat-lbl">Tracking</span>
      </div>
      <div class="stat-cell">
        <span class="stat-val off" id="recording-status">Off</span>
        <span class="stat-lbl">Recording</span>
      </div>
      <div class="stat-cell">
        <span class="stat-val" id="queue-status">0</span>
        <span class="stat-lbl">Local</span>
      </div>
    </div>

    <!-- Page Stats Bar -->
    <div class="section page-stats-bar">
      <span id="page-stats" class="page-stats-text">No page data</span>
    </div>

    <!-- Primary Actions -->
    <div class="section">
      <button id="btn-open-tracker" class="btn primary full-width">Open Eye Tracker</button>
    </div>

    <!-- Overlay Toggles -->
    <div class="section">
      <h2>Overlays</h2>
      <div class="btn-trio">
        <button id="btn-toggle-heatmap" class="btn toggle-btn" data-active="false">Heatmap</button>
        <button id="btn-toggle-scanpath" class="btn toggle-btn" data-active="false">Scanpath</button>
        <button id="btn-toggle-cursor" class="btn toggle-btn" data-active="false">Cursor</button>
      </div>
    </div>

    <!-- Collapsible: Tracking Controls -->
    <details class="section collapsible">
      <summary class="collapse-header">Tracking Controls</summary>
      <div class="collapse-body">
        <div class="btn-pair">
          <button id="btn-start" class="btn success" disabled>Start Tracking</button>
          <button id="btn-stop" class="btn danger" disabled>Stop Tracking</button>
        </div>
      </div>
    </details>

    <!-- Collapsible: Capture & Replay -->
    <details class="section collapsible">
      <summary class="collapse-header">Capture &amp; Replay</summary>
      <div class="collapse-body">
        <div class="btn-pair">
          <button id="btn-screenshot-viewport" class="btn">Viewport Shot</button>
          <button id="btn-screenshot-fullpage" class="btn">Full Page Shot</button>
        </div>
        <button id="btn-replay" class="btn full-width" style="margin-top:6px">Toggle Gaze Replay</button>
      </div>
    </details>

    <!-- Collapsible: Session -->
    <details class="section collapsible">
      <summary class="collapse-header">Session</summary>
      <div class="collapse-body">
        <div class="session-row">
          <input type="text" id="session-name" class="session-input" placeholder="Name this session...">
          <button id="btn-name-session" class="btn">Set</button>
        </div>
        <div class="btn-pair" style="margin-top:6px">
          <button id="btn-save-session" class="btn">Save</button>
          <button id="btn-new-session" class="btn">New Session</button>
        </div>
        <div id="saved-sessions" class="saved-sessions"></div>
      </div>
    </details>

    <!-- Footer Actions -->
    <div class="section footer-actions">
      <button id="btn-open-insights" class="btn full-width">Open Local Insights</button>
      <div class="btn-pair">
        <button id="btn-export" class="btn">Export</button>
        <button id="btn-clear" class="btn danger-outline">Clear Data</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
